<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — PDzOS Store</title>
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080B11">

  <!-- Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  
  <div class="bg-ambient" aria-hidden="true">
    <div class="bg-ambient-grid"></div>
  </div>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="assets/favicon/favicon.svg" alt="PDzOS Logo" class="brand-icon" width="36" height="36">
        <div class="brand-text">PDzOS <span>STORE</span></div>
      </a>
      <div class="header-actions">
        <button class="icon-btn btn-theme-toggle" aria-label="Toggle Theme" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 20px;">
    <div style="max-width: 540px; background: var(--bg-surface); border: 1px solid var(--border-medium); border-radius: var(--radius-xl); padding: 48px 32px; box-shadow: var(--shadow-lg);">
      <div style="font-family: var(--font-display); font-size: 5.5rem; font-weight: 800; line-height: 1; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 14px;">
        404
      </div>
      <h1 style="font-size: 1.8rem; margin-bottom: 12px;">Page Not Found</h1>
      <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 1.05rem;">
        The requested URL or application does not exist or has been relocated in the PDzOS Store catalog.
      </p>
      <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-secondary btn-lg">Back Home</a>
        <a href="apps.html" class="btn btn-primary btn-lg">Explore Apps</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="margin-top: 0;">
    <div class="container footer-bottom">
      <div>&copy; <span class="current-year">2026</span> PDzOS Store. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
