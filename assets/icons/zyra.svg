    <filter id="zyraFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#zyraBg)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2"/>
  <!-- Neural / Voice Waves -->
  <circle cx="64" cy="64" r="38" stroke="url(#zyraGlow)" stroke-width="2" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="64" cy="64" r="28" stroke="url(#zyraGlow)" stroke-width="2" stroke-dasharray="2 4" opacity="0.7"/>
