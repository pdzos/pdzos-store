<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="pdzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagonal Brand Mark -->
  <g transform="translate(6, 6)">
    <!-- Outer Hexagon ring -->
    <path d="M24 2 L43 13 L43 35 L24 46 L5 35 L5 13 Z" stroke="url(#pdzGrad)" stroke-width="2.5" fill="#0D1117" filter="url(#subtleGlow)"/>
    <!-- Inner Core & Accent -->
    <path d="M24 10 L35 17 L35 31 L24 38 L13 31 L13 17 Z" fill="url(#pdzGrad)" fill-opacity="0.15" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.2"/>
    <!-- Monogram P-D-Z stylized motif -->
    <path d="M19 18 L27 18 C29.2 18 31 19.8 31 22 C31 24.2 29.2 26 27 26 L19 26 L19 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="22" r="1.5" fill="#00F0FF"/>
  </g>
  <!-- Typography -->
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="#FFFFFF">
    PDzOS <tspan fill="url(#pdzGrad)">STORE</tspan>
  </text>
  <text x="65" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="9" letter-spacing="2.2" fill="#8B949E">
    ANDROID MARKETPLACE
  </text>
</svg>
