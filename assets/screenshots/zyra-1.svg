<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 720" fill="none">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="zyraAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
  </defs>
  <!-- Device Frame -->
  <rect x="4" y="4" width="372" height="712" rx="36" fill="url(#pBg)" stroke="#1E293B" stroke-width="6"/>
  <!-- Status Bar -->
  <text x="32" y="38" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="600">09:41</text>
  <circle cx="190" cy="32" r="6" fill="#000000"/>
  <rect x="315" y="28" width="18" height="10" rx="3" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- App Header -->
  <rect x="24" y="60" width="332" height="60" rx="16" fill="#111827" stroke="#1F2937"/>
  <circle cx="56" cy="90" r="18" fill="url(#zyraAccent)"/>
  <text x="86" y="88" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">ZYRA Neural Engine</text>
  <text x="86" y="104" fill="#00F0FF" font-family="sans-serif" font-size="11">● Active Context: Deep Learning</text>
  <!-- Chat stream -->
  <rect x="24" y="140" width="260" height="70" rx="16" fill="#1F2937"/>
  <text x="40" y="168" fill="#E2E8F0" font-family="sans-serif" font-size="13">"Optimize battery drain for</text>
  <text x="40" y="188" fill="#E2E8F0" font-family="sans-serif" font-size="13">background sensory routines."</text>
  <!-- AI Response -->
  <rect x="76" y="230" width="280" height="140" rx="18" fill="#131C31" stroke="rgba(0, 240, 255, 0.3)"/>
  <text x="96" y="262" fill="#00F0FF" font-family="sans-serif" font-size="12" font-weight="700">ZYRA CORE</text>
  <text x="96" y="290" fill="#F8FAFC" font-family="sans-serif" font-size="13">Switched sensory listener to</text>
  <text x="96" y="310" fill="#F8FAFC" font-family="sans-serif" font-size="13">ultra-low power hardware interrupts.</text>
  <text x="96" y="340" fill="#10B981" font-family="sans-serif" font-size="12">✔ Conserving ~18% battery/day</text>
  <!-- Interactive Wave Card -->
  <rect x="24" y="400" width="332" height="180" rx="20" fill="#0D1526" stroke="#1E293B"/>
  <text x="44" y="434" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="700">Voice Frequency Modulator</text>
  <!-- Wave graphic -->
  <path d="M44 510 Q 75 440, 110 510 T 170 510 T 230 470 T 290 530 T 336 510" fill="none" stroke="url(#zyraAccent)" stroke-width="3"/>
  <text x="44" y="555" fill="#94A3B8" font-family="sans-serif" font-size="11">Input Rate: 48kHz Lossless • Latency: 14ms</text>
  <!-- Voice trigger button -->
  <circle cx="190" cy="640" r="32" fill="url(#zyraAccent)"/>
  <circle cx="190" cy="640" r="14" fill="#FFFFFF"/>
</svg>
